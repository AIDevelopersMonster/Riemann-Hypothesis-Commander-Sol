name: H20-EXT arithmetic specificity

on:
  workflow_dispatch:
  push:
    branches:
      - research/hatter-sol-20-computational-structure-mining
    paths:
      - "papers/HATTER-SOL/20-FINITE-ARITHMETIC-SPATIALIZATION/H20_EXT_COMPUTATIONAL_STRUCTURE_MINING/H20_EXT_LAB09_PROTOCOL.md"
      - "papers/HATTER-SOL/20-FINITE-ARITHMETIC-SPATIALIZATION/H20_EXT_COMPUTATIONAL_STRUCTURE_MINING/tools/lab09_arithmetic_controls.cpp"
      - ".github/workflows/h20-ext-arithmetic-specificity.yml"

jobs:
  lab09:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build exact arithmetic-control engine
        working-directory: papers/HATTER-SOL/20-FINITE-ARITHMETIC-SPATIALIZATION/H20_EXT_COMPUTATIONAL_STRUCTURE_MINING
        run: g++ -O3 -std=c++17 -march=native tools/lab09_arithmetic_controls.cpp -o lab09
      - name: Run frozen LAB-09
        working-directory: papers/HATTER-SOL/20-FINITE-ARITHMETIC-SPATIALIZATION/H20_EXT_COMPUTATIONAL_STRUCTURE_MINING
        run: |
          ./lab09
          cat H20_EXT_LAB09_REPORT.md
      - name: Upload LAB-09 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h20-ext-arithmetic-specificity
          path: |
            papers/HATTER-SOL/20-FINITE-ARITHMETIC-SPATIALIZATION/H20_EXT_COMPUTATIONAL_STRUCTURE_MINING/lab09_arithmetic_controls.csv
            papers/HATTER-SOL/20-FINITE-ARITHMETIC-SPATIALIZATION/H20_EXT_COMPUTATIONAL_STRUCTURE_MINING/H20_EXT_LAB09_REPORT.md
