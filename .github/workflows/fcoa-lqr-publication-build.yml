name: FCOA LQR publication build

on:
  workflow_dispatch:
  push:
    branches:
      - director/fcoa-rigidity-cost
    paths:
      - "papers/FCOA-LQR-SYNCHRONIZATION/**"
      - "delegated/FCOA_RIGIDITY_COST/QGE3/LQR_*.md"
      - "delegated/FCOA_RIGIDITY_COST/QGE3/verify_lqr*.py"
      - ".github/workflows/fcoa-lqr-publication-build.yml"

permissions:
  contents: write

concurrency:
  group: fcoa-lqr-publication-build
  cancel-in-progress: true

jobs:
  build-publication:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: director/fcoa-rigidity-cost
          fetch-depth: 0

      - name: Install publication toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice python3-docx poppler-utils zip fonts-dejavu-core fonts-liberation

      - name: Prepare build directories
        run: |
          rm -rf papers/FCOA-LQR-SYNCHRONIZATION/artifacts
          mkdir -p papers/FCOA-LQR-SYNCHRONIZATION/artifacts/reproducibility
          mkdir -p papers/FCOA-LQR-SYNCHRONIZATION/artifacts/qa
          mkdir -p .build_lqr

      - name: Build DOCX sources
        run: |
          pandoc papers/FCOA-LQR-SYNCHRONIZATION/article_en.md --from=markdown+tex_math_dollars --to=docx --output=papers/FCOA-LQR-SYNCHRONIZATION/artifacts/article_en.docx
          pandoc papers/FCOA-LQR-SYNCHRONIZATION/article_ru.md --from=markdown+tex_math_dollars --to=docx --output=papers/FCOA-LQR-SYNCHRONIZATION/artifacts/article_ru.docx

      - name: Apply publication DOCX layout
        run: |
          cat > .build_lqr/polish_docx.py <<'PY'
          from pathlib import Path
          from docx import Document
          from docx.shared import Inches, Pt
          from docx.enum.text import WD_ALIGN_PARAGRAPH
          from docx.oxml import OxmlElement
          from docx.oxml.ns import qn

          def add_page_field(paragraph):
              paragraph.alignment = WD_ALIGN_PARAGRAPH.CENTER
              run = paragraph.add_run()
              fld_char1 = OxmlElement('w:fldChar')
              fld_char1.set(qn('w:fldCharType'), 'begin')
              instr = OxmlElement('w:instrText')
              instr.set(qn('xml:space'), 'preserve')
              instr.text = ' PAGE '
              fld_char2 = OxmlElement('w:fldChar')
              fld_char2.set(qn('w:fldCharType'), 'end')
              run._r.append(fld_char1)
              run._r.append(instr)
              run._r.append(fld_char2)

          def style_doc(path):
              doc = Document(path)
              for section in doc.sections:
                  section.page_width = Inches(8.5)
                  section.page_height = Inches(11)
                  section.top_margin = Inches(0.78)
                  section.bottom_margin = Inches(0.78)
                  section.left_margin = Inches(0.86)
                  section.right_margin = Inches(0.86)
                  section.header_distance = Inches(0.35)
                  section.footer_distance = Inches(0.35)
                  hp = section.header.paragraphs[0]
                  hp.text = 'FCOA - Point-Image Phase Synchronization - v1.0-rc1'
                  hp.alignment = WD_ALIGN_PARAGRAPH.CENTER
                  if hp.runs:
                      hp.runs[0].font.name = 'Liberation Serif'
                      hp.runs[0].font.size = Pt(8)
                  fp = section.footer.paragraphs[0]
                  add_page_field(fp)
                  for r in fp.runs:
                      r.font.name = 'Liberation Serif'
                      r.font.size = Pt(8)
              styles = doc.styles
              normal = styles['Normal']
              normal.font.name = 'Liberation Serif'
              normal.font.size = Pt(10.5)
              normal.paragraph_format.space_after = Pt(5)
              normal.paragraph_format.line_spacing = 1.08
              for name, size in [('Title', 20), ('Subtitle', 13), ('Heading 1', 15), ('Heading 2', 12.5), ('Heading 3', 11.5)]:
                  if name in styles:
                      st = styles[name]
                      st.font.name = 'Liberation Sans'
                      st.font.size = Pt(size)
                      st.font.bold = name != 'Subtitle'
              for p in doc.paragraphs[:3]:
                  if p.style.name in ('Title', 'Heading 1'):
                      p.alignment = WD_ALIGN_PARAGRAPH.CENTER
              doc.core_properties.title = 'Reflections on Point-Image Phase Synchronization with Commander Sol'
              doc.core_properties.subject = 'FCOA rigidity cost and point-image phase synchronization'
              doc.core_properties.author = 'Alex Malachevsky; Commander Sol'
              doc.core_properties.keywords = 'FCOA; permutation synchronization; unique colorability; cut spaces; rigidity cost'
              doc.save(path)

          for p in [
              Path('papers/FCOA-LQR-SYNCHRONIZATION/artifacts/article_en.docx'),
              Path('papers/FCOA-LQR-SYNCHRONIZATION/artifacts/article_ru.docx')
          ]:
              style_doc(p)
          PY
          python3 .build_lqr/polish_docx.py

      - name: Convert DOCX to PDF
        run: |
          libreoffice --headless --convert-to pdf --outdir papers/FCOA-LQR-SYNCHRONIZATION/artifacts papers/FCOA-LQR-SYNCHRONIZATION/artifacts/article_en.docx
          libreoffice --headless --convert-to pdf --outdir papers/FCOA-LQR-SYNCHRONIZATION/artifacts papers/FCOA-LQR-SYNCHRONIZATION/artifacts/article_ru.docx

      - name: Build HTML and LaTeX sources
        run: |
          pandoc papers/FCOA-LQR-SYNCHRONIZATION/article_en.md --standalone --mathml --metadata title="Reflections on Point-Image Phase Synchronization with Commander Sol" --output=papers/FCOA-LQR-SYNCHRONIZATION/artifacts/article_en.html
          pandoc papers/FCOA-LQR-SYNCHRONIZATION/article_ru.md --standalone --mathml --metadata title="Размышления о синхронизации фаз по образам точек с Commander Sol" --output=papers/FCOA-LQR-SYNCHRONIZATION/artifacts/article_ru.html
          pandoc papers/FCOA-LQR-SYNCHRONIZATION/article_en.md --from=markdown+tex_math_dollars --to=latex --output=papers/FCOA-LQR-SYNCHRONIZATION/artifacts/article_en.tex
          pandoc papers/FCOA-LQR-SYNCHRONIZATION/article_ru.md --from=markdown+tex_math_dollars --to=latex --output=papers/FCOA-LQR-SYNCHRONIZATION/artifacts/article_ru.tex

      - name: Copy theorem provenance and verifiers
        run: |
          SRC=delegated/FCOA_RIGIDITY_COST/QGE3
          DST=papers/FCOA-LQR-SYNCHRONIZATION/artifacts/reproducibility
          cp "$SRC/LQR_DEFINITIONS.md" "$DST/"
          cp "$SRC/LQR_SMALL_TABLES.md" "$DST/"
          cp "$SRC/LQR_LOWER_BOUNDS.md" "$DST/"
          cp "$SRC/LQR_CONSTRUCTIONS.md" "$DST/"
          cp "$SRC/LQR_BINARY_CUT_GADGET.md" "$DST/"
          cp "$SRC/LQR_R4_THEOREM.md" "$DST/"
          cp "$SRC/LQR_STABILIZATION_THEOREM.md" "$DST/"
          cp "$SRC/LQR_HOSTILE_AUDIT.md" "$DST/"
          cp "$SRC/LQR_PRIORITY_AUDIT.md" "$DST/"
          cp "$SRC/LQR_PUBLICATION_GATE.md" "$DST/"
          cp "$SRC/LQR_STATUS.md" "$DST/"
          cp "$SRC/verify_lqr.py" "$DST/"
          cp "$SRC/verify_lqr_cutspace.py" "$DST/"

      - name: Run exact finite verifiers
        run: |
          set -o pipefail
          {
            echo "# FCOA LQR verifier log"
            echo "commit: $GITHUB_SHA"
            echo "utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "## verify_lqr.py"
            python3 delegated/FCOA_RIGIDITY_COST/QGE3/verify_lqr.py
            echo
            echo "## verify_lqr_cutspace.py"
            python3 delegated/FCOA_RIGIDITY_COST/QGE3/verify_lqr_cutspace.py
          } | tee papers/FCOA-LQR-SYNCHRONIZATION/artifacts/reproducibility/VERIFICATION_LOG.txt

      - name: PDF preflight and render smoke test
        run: |
          {
            echo "# PDF preflight"
            echo
            echo "## English"
            pdfinfo papers/FCOA-LQR-SYNCHRONIZATION/artifacts/article_en.pdf
            echo
            echo "## Russian"
            pdfinfo papers/FCOA-LQR-SYNCHRONIZATION/artifacts/article_ru.pdf
          } > papers/FCOA-LQR-SYNCHRONIZATION/artifacts/qa/PDFINFO.txt
          pdftoppm -f 1 -singlefile -png -r 120 papers/FCOA-LQR-SYNCHRONIZATION/artifacts/article_en.pdf papers/FCOA-LQR-SYNCHRONIZATION/artifacts/qa/article_en_page1
          pdftoppm -f 1 -singlefile -png -r 120 papers/FCOA-LQR-SYNCHRONIZATION/artifacts/article_ru.pdf papers/FCOA-LQR-SYNCHRONIZATION/artifacts/qa/article_ru_page1
          pdftotext papers/FCOA-LQR-SYNCHRONIZATION/artifacts/article_en.pdf .build_lqr/en.txt
          pdftotext papers/FCOA-LQR-SYNCHRONIZATION/artifacts/article_ru.pdf .build_lqr/ru.txt
          test -s .build_lqr/en.txt
          test -s .build_lqr/ru.txt

      - name: Assemble release directory and checksums
        run: |
          ROOT=papers/FCOA-LQR-SYNCHRONIZATION
          cp "$ROOT/article_en.md" "$ROOT/artifacts/"
          cp "$ROOT/article_ru.md" "$ROOT/artifacts/"
          cp "$ROOT/README.md" "$ROOT/artifacts/"
          cp "$ROOT/CITATION.cff" "$ROOT/artifacts/"
          cp "$ROOT/metadata.json" "$ROOT/artifacts/"
          cp "$ROOT/PRE_RELEASE_AUDIT.md" "$ROOT/artifacts/"
          cp "$ROOT/SOURCE_MAP.md" "$ROOT/artifacts/"
          if [ -f "$ROOT/ZENODO_METADATA.json" ]; then cp "$ROOT/ZENODO_METADATA.json" "$ROOT/artifacts/"; fi
          if [ -f "$ROOT/RELEASE_NOTES.md" ]; then cp "$ROOT/RELEASE_NOTES.md" "$ROOT/artifacts/"; fi
          if [ -f "$ROOT/ZENODO_UPLOAD_CHECKLIST.md" ]; then cp "$ROOT/ZENODO_UPLOAD_CHECKLIST.md" "$ROOT/artifacts/"; fi
          cd "$ROOT/artifacts"
          find . -type f ! -name MANIFEST.sha256 -print0 | sort -z | xargs -0 sha256sum > MANIFEST.sha256
          cd ..
          rm -f FCOA-LQR-SYNCHRONIZATION-v1.0-rc1.zip
          zip -qr FCOA-LQR-SYNCHRONIZATION-v1.0-rc1.zip artifacts

      - name: Upload publication bundle
        uses: actions/upload-artifact@v4
        with:
          name: FCOA-LQR-SYNCHRONIZATION-v1.0-rc1
          path: |
            papers/FCOA-LQR-SYNCHRONIZATION/artifacts
            papers/FCOA-LQR-SYNCHRONIZATION/FCOA-LQR-SYNCHRONIZATION-v1.0-rc1.zip
          if-no-files-found: error
          retention-days: 90

      - name: Commit generated publication artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/FCOA-LQR-SYNCHRONIZATION/artifacts
          git add -f papers/FCOA-LQR-SYNCHRONIZATION/FCOA-LQR-SYNCHRONIZATION-v1.0-rc1.zip
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Build FCOA LQR publication artifacts"
            git pull --rebase origin director/fcoa-rigidity-cost
            git push origin HEAD:director/fcoa-rigidity-cost
          fi
