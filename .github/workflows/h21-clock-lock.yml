name: H21 fixed stratum clock lock

on:
  workflow_dispatch:
  push:
    branches:
      - research/hatter-sol-world-response-rubik-machine
    paths:
      - "papers/HATTER-SOL/21-INTERWORLD-PRIMALITY-TOMOGRAPHY/H21_19_CLOCK_LOCK_DIAGNOSTICS.md"
      - "papers/HATTER-SOL/21-INTERWORLD-PRIMALITY-TOMOGRAPHY/tools/clock_lock_diagnostics.py"
      - ".github/workflows/h21-clock-lock.yml"

jobs:
  lab13:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        dmax: [127, 255]
    steps:
      - uses: actions/checkout@v4
      - name: Run fixed-stratum clock-lock diagnostics
        working-directory: papers/HATTER-SOL/21-INTERWORLD-PRIMALITY-TOMOGRAPHY
        run: python3 tools/clock_lock_diagnostics.py --bits 18 --dmax ${{ matrix.dmax }} --out-dir lab13_d${{ matrix.dmax }}
      - uses: actions/upload-artifact@v4
        with:
          name: h21-lab13-d${{ matrix.dmax }}
          path: papers/HATTER-SOL/21-INTERWORLD-PRIMALITY-TOMOGRAPHY/lab13_d${{ matrix.dmax }}/