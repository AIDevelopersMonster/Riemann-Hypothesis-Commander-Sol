name: H21 scalar fiber residuals

on:
  workflow_dispatch:
  push:
    branches:
      - research/hatter-sol-world-response-rubik-machine
    paths:
      - "papers/HATTER-SOL/21-INTERWORLD-PRIMALITY-TOMOGRAPHY/H21_28_SINGLE_SCALAR_FIBER_THEOREM.md"
      - "papers/HATTER-SOL/21-INTERWORLD-PRIMALITY-TOMOGRAPHY/tools/scalar_fiber_residuals.py"
      - ".github/workflows/h21-scalar-fiber-residuals.yml"

jobs:
  lab19:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        dmax: [63, 127]
    steps:
      - uses: actions/checkout@v4
      - name: Run scalar-fiber residual laboratory
        working-directory: papers/HATTER-SOL/21-INTERWORLD-PRIMALITY-TOMOGRAPHY
        run: python3 tools/scalar_fiber_residuals.py --bits 18 --dmax ${{ matrix.dmax }} --out-dir lab19_d${{ matrix.dmax }}
      - uses: actions/upload-artifact@v4
        with:
          name: h21-lab19-d${{ matrix.dmax }}
          path: papers/HATTER-SOL/21-INTERWORLD-PRIMALITY-TOMOGRAPHY/lab19_d${{ matrix.dmax }}/