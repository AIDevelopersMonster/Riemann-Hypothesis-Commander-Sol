name: H20-EXT low4 fresh holdout

on:
  workflow_dispatch:
  push:
    branches:
      - research/hatter-sol-20-computational-structure-mining
    paths:
      - "papers/HATTER-SOL/20-FINITE-ARITHMETIC-SPATIALIZATION/H20_EXT_COMPUTATIONAL_STRUCTURE_MINING/H20_EXT_LAB05_PROTOCOL.md"
      - "papers/HATTER-SOL/20-FINITE-ARITHMETIC-SPATIALIZATION/H20_EXT_COMPUTATIONAL_STRUCTURE_MINING/tools/validate_low4_holdout.py"
      - ".github/workflows/h20-ext-low4-holdout.yml"

jobs:
  lab05:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compute fresh widths
        working-directory: papers/HATTER-SOL/20-FINITE-ARITHMETIC-SPATIALIZATION/H20_EXT_COMPUTATIONAL_STRUCTURE_MINING
        run: |
          python3 tools/walsh_stratified_falsification.py --out-dir lab05_out --widths 17 18 19
      - name: Apply frozen validation criterion
        working-directory: papers/HATTER-SOL/20-FINITE-ARITHMETIC-SPATIALIZATION/H20_EXT_COMPUTATIONAL_STRUCTURE_MINING
        run: |
          cat lab05_out/H20_EXT_LAB04_REPORT.md
          python3 tools/validate_low4_holdout.py lab05_out/walsh_stratified_summary.json
      - name: Upload LAB-05 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h20-ext-low4-holdout
          path: |
            papers/HATTER-SOL/20-FINITE-ARITHMETIC-SPATIALIZATION/H20_EXT_COMPUTATIONAL_STRUCTURE_MINING/lab05_out/walsh_stratified_summary.json
            papers/HATTER-SOL/20-FINITE-ARITHMETIC-SPATIALIZATION/H20_EXT_COMPUTATIONAL_STRUCTURE_MINING/lab05_out/H20_EXT_LAB04_REPORT.md
