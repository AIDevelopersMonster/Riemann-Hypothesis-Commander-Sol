name: H21 projective shadow coupling

on:
  workflow_dispatch:
  push:
    branches:
      - research/hatter-sol-world-response-rubik-machine
    paths:
      - "papers/HATTER-SOL/21-INTERWORLD-PRIMALITY-TOMOGRAPHY/H21_26_PROJECTIVE_SHADOW_COUPLING.md"
      - "papers/HATTER-SOL/21-INTERWORLD-PRIMALITY-TOMOGRAPHY/tools/projective_shadow_coupling.py"
      - ".github/workflows/h21-projective-shadow-coupling.yml"

jobs:
  lab18:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        dmax: [63, 127]
    steps:
      - uses: actions/checkout@v4
      - name: Run projective-shadow coupling decomposition
        working-directory: papers/HATTER-SOL/21-INTERWORLD-PRIMALITY-TOMOGRAPHY
        run: python3 tools/projective_shadow_coupling.py --bits 18 --dmax ${{ matrix.dmax }} --out-dir lab18_d${{ matrix.dmax }}
      - uses: actions/upload-artifact@v4
        with:
          name: h21-lab18-d${{ matrix.dmax }}
          path: papers/HATTER-SOL/21-INTERWORLD-PRIMALITY-TOMOGRAPHY/lab18_d${{ matrix.dmax }}/